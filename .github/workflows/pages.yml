# Publishes the project page (index.html + assets/) to GitHub Pages.
# Only the page is deployed: no Jekyll build and no submodules (Jekyll over the whole repository fails on the
# submodules' markdown). Repository settings → Pages → Source must be "GitHub Actions".
name: Deploy project page

on:
  push:
    branches: [main]
    paths: ["index.html", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          sparse-checkout: |
            index.html
            assets
          sparse-checkout-cone-mode: false
      - name: Collect the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
